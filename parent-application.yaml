apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: parent-loki-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/solaris24/loki-minio.git
    targetRevision: feature/argo
    path: .
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true

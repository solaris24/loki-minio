---
deploymentMode: SimpleScalable # SingleBinary

loki:
  auth_enabled: false
  
  storage:
    type: s3

  readinessProbe:
    httpGet:
      path: /ready
      port: http-metrics
    initialDelaySeconds: 45
    timeoutSeconds: 1

  limits_config:
    reject_old_samples: true
    reject_old_samples_max_age: 2400h
    max_cache_freshness_per_query: 10m
    split_queries_by_interval: 15m
    query_timeout: 300s
    volume_enabled: true
    allow_structured_metadata: true
    max_query_lookback: 2400h # 100 days
    retention_period: 2400h   # 100 days

  ingester:
    chunk_encoding: snappy

  tracing:
    enabled: true

  querier:
    max_concurrent: 4

  ruler:
    enable_api: true
  
  pattern_ingester:
    enabled: true

  commonConfig:
    replication_factor: 1

  schemaConfig:
    configs:
      - from: 2024-04-01
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: loki_index_
          period: 24h

  compactor:
    retention_enabled: false
    compaction_interval: 10m
    working_directory: /tmp/retention
    delete_request_store: s3

write:
  replicas: 1
  persistence:
    size: 1Gi
  affinity: {}    

read:
  replicas: 1
  persistence:
    size: 1Gi
  affinity: {}   

backend:
  replicas: 1
  persistence:
    size: 1Gi
  affinity: {}  

chunksCache:
  allocatedMemory: 512

singleBinary:
  replicas: 0

minio:
  enabled: true
  replicas: 1
  buckets:
  - name: chunks
    policy: none
    purge: false
  - name: ruler
    policy: none
    purge: false
  - name: admin
    policy: none
    purge: false
  persistence:
    size: 1Gi
  resources:
    requests:
      cpu: 100m
      memory: 128Mi

compactor:
  persistence:
    enabled: false

# Monitoring configuration required by the template
monitoring:
  dashboards:
    enabled: false
  rules:
    enabled: false
  serviceMonitor:
    enabled: false
  lokiCanary:
    enabled: false
